services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # Set both to 1 once the app is behind HTTPS (e.g. Caddy/nginx with a certificate).
      TRUST_PROXY: "0"
      COOKIE_SECURE: "0"
    volumes:
      - tube-data:/data
volumes:
  tube-data:
