# Production: PostgreSQL + the app + Caddy (HTTPS). Works the same on a company server or a VPS.
#   cp .env.example .env   # fill it in
#   docker compose up -d --build
name: tube-procurement

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: tube
      POSTGRES_USER: tube
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tube -d tube"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build: ..
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://tube:${DB_PASSWORD}@db:5432/tube
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}
      TRUST_PROXY: "1"
      COOKIE_SECRET: ${COOKIE_SECRET:?set COOKIE_SECRET in .env}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?set GOOGLE_CLIENT_ID in .env}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?set GOOGLE_CLIENT_SECRET in .env}
      GOOGLE_ALLOWED_DOMAINS: ${GOOGLE_ALLOWED_DOMAINS:-tubecafecambodia.com}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:?set BOOTSTRAP_ADMIN_EMAIL in .env}
      BOOTSTRAP_ADMIN_NAME: ${BOOTSTRAP_ADMIN_NAME:-Administrator}

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
      # "internal" for a company-network server without a public domain (browsers must trust
      # Caddy's local certificate); leave empty on a VPS with a real domain for Let's Encrypt.
      TLS_MODE: ${TLS_MODE:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  db-data:
  caddy-data:
