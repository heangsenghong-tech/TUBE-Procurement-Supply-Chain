<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sign in · Tube Procurement</title>
<meta name="theme-color" content="#FFCD00">
<link rel="icon" type="image/png" href="/assets/tube-logo.png">
<link rel="apple-touch-icon" href="/assets/tube-logo.png">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/assets/shell.css">
</head>
<body>
<div class="wrap narrow">
  <div class="hero">
    <img src="/assets/tube-logo.png" alt="Tube Coffee">
    <div>
      <h1>Tube Procurement &amp; Supply Chain</h1>
      <div class="sub">Tube Cafe Co., Ltd.</div>
    </div>
  </div>
  <form class="card" id="loginForm">
    <h2>Sign in</h2>
    <div class="section-note">Use the email and password your administrator gave you.</div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="username" required></div>
    <div class="field"><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required></div>
    <button class="btn-primary full" type="submit" id="submitBtn">Sign in</button>
    <div class="msg err" id="msg"></div>
  </form>
  <div class="sub" style="text-align:center;">Forgot your password? Ask the Procurement &amp; Supply Chain administrator to reset it.</div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async function (e) {
  e.preventDefault();
  var btn = document.getElementById('submitBtn'), msg = document.getElementById('msg');
  btn.disabled = true; msg.textContent = '';
  try {
    var res = await fetch('/api/login', {
      method: 'POST', credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-Tube-Request': '1' },
      body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
    });
    var json = await res.json().catch(function () { return {}; });
    if (!res.ok) throw new Error(json.error || 'Could not sign in.');
    window.location.href = '/';
  } catch (err) {
    msg.textContent = err.message === 'Failed to fetch' ? 'Can\'t reach the server.' : err.message;
    btn.disabled = false;
  }
});
</script>
</body>
</html>
